[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*/migrations/*", ".venv", "ml"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["apps", "common"]
addopts = "-q --strict-markers"
markers = ["slow: testes mais lentos (treino de modelo)"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["apps", "common"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/apps.py",
    "*/management/commands/*",
    "*/admin.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
